  <!-- Starlight Local Intel. Hidden until the catalog layer enables it. -->
  <section id="starlight-intel" class="starlight-intel" role="region" aria-labelledby="starlight-intel-name" hidden>
    <div class="starlight-intel-head">
      <span class="starlight-intel-title" id="starlight-intel-name">Starlight Local Intel</span>
      <span class="starlight-intel-status" role="status" aria-live="polite" data-intel-status>Disabled</span>
      <button type="button" class="starlight-intel-minimize" data-intel-minimize aria-expanded="true" aria-controls="starlight-intel" title="Minimize">&#8211;</button>
    </div>
    <p class="starlight-intel-meta" data-intel-meta></p>
    <!-- Quantum link key: click the padlock line for the entropy details. -->
    <button type="button" class="starlight-intel-qkey" data-intel-qkey aria-expanded="false" hidden></button>
    <dl class="starlight-intel-qkey-detail" data-intel-qkey-detail hidden></dl>
    <form class="starlight-intel-ask" data-intel-form>
      <input
        id="starlight-intel-question"
        type="text"
        data-intel-input
        aria-label="Ask about the local data"
        placeholder="Ask about the local data"
        autocomplete="off"
      />
      <button type="submit">Ask</button>
    </form>
    <!-- How the model read the question and where the gazetteer put it. -->
    <p class="starlight-intel-reading" data-intel-reading hidden></p>
    <p class="starlight-intel-answer" data-intel-answer></p>
    <ul class="starlight-intel-citations" aria-label="Citations" data-intel-citations></ul>
    <!-- The pipeline's steps and timings: proof the answer was made here. -->
    <ol class="starlight-intel-trace" aria-label="How this was answered" data-intel-trace hidden></ol>
  </section>
